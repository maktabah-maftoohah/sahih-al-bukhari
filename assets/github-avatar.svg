<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Master Circular Mask / Safe Boundary -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="256" />
    </clipPath>

    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011711" />
    </linearGradient>

    <linearGradient id="avGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <radialGradient id="avGlow" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="65%" stop-color="#047857" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&amp;family=Inter:wght@700;800&amp;display=swap');
      .ar-avatar { font-family: 'Amiri', 'Traditional Arabic', serif; font-weight: 700; }
      .latin-avatar { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Base Background Circle -->
    <circle cx="256" cy="256" r="256" fill="url(#avBg)" />

    <!-- Ambient Emerald Glow -->
    <circle cx="256" cy="235" r="210" fill="url(#avGlow)" />

    <!-- Outer Decorative Concentric Gold Rings -->
    <circle cx="256" cy="256" r="246" fill="none" stroke="url(#avGold)" stroke-width="4" stroke-opacity="0.9" />
    <circle cx="256" cy="256" r="236" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="256" cy="256" r="226" fill="none" stroke="url(#avGold)" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />

    <!-- Interlocking 8-Point Islamic Star Medallion (Center Behind Book) -->
    <g transform="translate(256, 215)" opacity="0.25" stroke="url(#avGold)" stroke-width="2.5" fill="none">
      <rect x="-120" y="-120" width="240" height="240" rx="16" />
      <rect x="-120" y="-120" width="240" height="240" rx="16" transform="rotate(45)" />
    </g>

    <!-- Central Scaled Open Hadith Tome -->
    <g transform="translate(256, 205)">
      <!-- Drop Shadow -->
      <ellipse cx="0" cy="85" rx="115" ry="14" fill="#000000" opacity="0.5" />

      <!-- Leather Cover (Emerald) -->
      <path d="M-116,68 Q-58,82 0,72 Q58,82 116,68 L122,-45 Q58,-31 0,-42 Q-58,-31 -122,-45 Z" 
            fill="#065f46" stroke="url(#avGold)" stroke-width="3" />

      <!-- Parchment Pages -->
      <path d="M-108,60 Q-54,72 0,64 Q54,72 108,60 L114,-38 Q54,-26 0,-34 Q-54,-26 -114,-38 Z" 
            fill="#fefce8" stroke="#cbd5e1" stroke-width="1" />

      <!-- Center Fold -->
      <line x1="0" y1="-35" x2="0" y2="65" stroke="#047857" stroke-width="2" />

      <!-- Ruling Lines Left Page -->
      <line x1="-92" y1="-14" x2="-20" y2="-9" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-96" y1="4" x2="-20" y2="9" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-92" y1="22" x2="-20" y2="27" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />

      <!-- Ruling Lines Right Page -->
      <line x1="20" y1="-9" x2="92" y2="-14" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
      <line x1="20" y1="9" x2="96" y2="4" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
      <line x1="20" y1="27" x2="92" y2="22" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />

      <!-- Golden Bookmark Ribbon -->
      <path d="M-4,-36 Q-2,8 6,76 L18,84 L14,72 Q3,8 4,-36 Z" fill="#d97706" stroke="#b45309" stroke-width="1" />
    </g>

    <!-- Bold Arabic Headline: "صحيح البخاري" -->
    <text x="256" y="340" text-anchor="middle" class="ar-avatar" font-size="42" fill="url(#avGold)">صَحِيحُ الْبُخَارِيِّ</text>

    <!-- English/Malay Sub-title: "SAHIH AL-BUKHARI" -->
    <text x="256" y="380" text-anchor="middle" class="latin-avatar" font-size="16.5" fill="#f8fafc" letter-spacing="3.5">SAHIH AL-BUKHARI</text>

    <!-- Bottom Organization Arc Pill -->
    <g transform="translate(256, 422)">
      <rect x="-115" y="-14" width="230" height="28" rx="8" fill="#042a20" stroke="#10b981" stroke-width="1.2" />
      <circle cx="-95" cy="0" r="2.5" fill="#fbbf24" />
      <circle cx="95" cy="0" r="2.5" fill="#fbbf24" />
      <text x="0" y="5" text-anchor="middle" class="latin-avatar" font-size="11" fill="#34d399" letter-spacing="2">MAKTABAH MAFTOOHAH</text>
    </g>
  </g>
</svg>