<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a13" />
      <stop offset="40%" stop-color="#042f24" />
      <stop offset="75%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#01140e" />
    </linearGradient>

    <!-- Radiant Gold Text Gradient -->
    <linearGradient id="sbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Radiant Emerald Glow (Left) -->
    <radialGradient id="sbGlowLeft" cx="20%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#047857" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#021a13" stop-opacity="0" />
    </radialGradient>

    <!-- Radiant Gold Glow (Right behind Medallion) -->
    <radialGradient id="sbGlowRight" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#021a13" stop-opacity="0" />
    </radialGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,400&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      .sb-ar-headline { font-family: 'Amiri', 'Traditional Arabic', serif; font-weight: 700; }
      .sb-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; }
      .sb-desc { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; }
      .sb-badge { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- 1. Background Surface -->
  <rect width="1280" height="640" fill="url(#sbBg)" />

  <!-- 2. Dual Radiant Ambient Glows -->
  <circle cx="280" cy="300" r="420" fill="url(#sbGlowLeft)" />
  <circle cx="1020" cy="320" r="380" fill="url(#sbGlowRight)" />

  <!-- 3. Islamic Star Geometric Watermark Pattern (Subtle Background Geometry) -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1.5" fill="none">
    <!-- Star repeats across background -->
    <g transform="translate(150, 120)"><rect x="-50" y="-50" width="100" height="100" rx="8"/><rect x="-50" y="-50" width="100" height="100" rx="8" transform="rotate(45)"/></g>
    <g transform="translate(480, 80)"><rect x="-40" y="-40" width="80" height="80" rx="6"/><rect x="-40" y="-40" width="80" height="80" rx="6" transform="rotate(45)"/></g>
    <g transform="translate(720, 150)"><rect x="-60" y="-60" width="120" height="120" rx="10"/><rect x="-60" y="-60" width="120" height="120" rx="10" transform="rotate(45)"/></g>
    <g transform="translate(300, 560)"><rect x="-45" y="-45" width="90" height="90" rx="6"/><rect x="-45" y="-45" width="90" height="90" rx="6" transform="rotate(45)"/></g>
    <g transform="translate(620, 520)"><rect x="-55" y="-55" width="110" height="110" rx="8"/><rect x="-55" y="-55" width="110" height="110" rx="8" transform="rotate(45)"/></g>
  </g>

  <!-- 4. Outer Border Frame with Corner Accents -->
  <rect width="1240" height="600" x="20" y="20" rx="24" fill="none" stroke="url(#sbGold)" stroke-width="1.5" stroke-opacity="0.45" />
  <rect width="1224" height="584" x="28" y="28" rx="20" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.25" />

  <!-- Corner Islamic Accents -->
  <g stroke="url(#sbGold)" stroke-width="2" fill="none" opacity="0.75">
    <path d="M36,65 L36,36 L65,36" />
    <path d="M1244,65 L1244,36 L1215,36" />
    <path d="M36,575 L36,604 L65,604" />
    <path d="M1244,575 L1244,604 L1215,604" />
  </g>

  <!-- ========================================================================= -->
  <!-- 5. LEFT CONTENT AREA (Branding, Titles, Metadata, Feature Badges)         -->
  <!-- ========================================================================= -->

  <!-- Top Organization Header Pill -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="370" height="36" rx="18" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="20" cy="18" r="4" fill="#fbbf24" />
    <text x="35" y="23" class="sb-badge" font-size="13.5" fill="#34d399" letter-spacing="1.5">MAKTABAH MAFTOOHAH</text>
    <text x="238" y="23" class="sb-ar-headline" font-size="15" fill="#a7f3d0">|  المكتبة المفتوحة</text>
  </g>

  <!-- Canonical Arabic Calligraphy Headline -->
  <text x="80" y="165" class="sb-ar-headline" font-size="44" fill="url(#sbGold)" letter-spacing="1">
    الْجَامِعُ الْمُسْنَدُ الصَّحِيحُ — صَحِيحُ الْبُخَارِيِّ
  </text>

  <!-- Main Latin Title -->
  <text x="80" y="240" class="sb-title" font-size="64" fill="#ffffff" letter-spacing="-0.5">
    Sahih al-Bukhari
  </text>

  <!-- Primary Subtitle / Tagline -->
  <text x="80" y="295" class="sb-desc" font-size="22" font-weight="600" fill="#fde68a">
    Open-Source, Offline-First Digital Hadith Study Platform
  </text>

  <!-- Secondary Descriptive Paragraph -->
  <text x="80" y="332" class="sb-desc" font-size="16" fill="#cbd5e1">
    Koleksi 97 Kitab, 7,589 Hadis Autentik dengan Teks Arab Berbaris (Tashkeel), Sanad &amp; Matn,
  </text>
  <text x="80" y="358" class="sb-desc" font-size="16" fill="#94a3b8">
    terjemahan Melayu &amp; Inggeris, naskhah imbasan Sultaniyyah (Bulaq 1311 H), serta EPUB 3.0.
  </text>

  <!-- Feature Badge Pills (2 rows of 3 pills) -->
  <g transform="translate(80, 400)">
    <!-- Row 1 -->
    <!-- Pill 1: 97 Kitab & 7,589 Hadis -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="22" font-size="14">📖</text>
      <text x="38" y="22" class="sb-badge" font-size="13" fill="#f8fafc">97 Kitab, 7,589 Hadis</text>
    </g>

    <!-- Pill 2: Teks Arab Berbaris -->
    <g transform="translate(202, 0)">
      <rect x="0" y="0" width="200" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="22" font-size="14">📜</text>
      <text x="38" y="22" class="sb-badge" font-size="13" fill="#f8fafc">Teks Arab Berbaris Penuh</text>
    </g>

    <!-- Pill 3: Melayu & English -->
    <g transform="translate(414, 0)">
      <rect x="0" y="0" width="195" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="22" font-size="14">🇲🇾</text>
      <text x="38" y="22" class="sb-badge" font-size="13" fill="#f8fafc">Terjemahan Dwibahasa</text>
    </g>

    <!-- Row 2 -->
    <!-- Pill 4: Zero-Build Vanilla ES6 & PWA -->
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="190" height="34" rx="8" fill="#042f24" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.2" />
      <text x="14" y="22" font-size="14">⚡</text>
      <text x="38" y="22" class="sb-badge" font-size="13" fill="#fde68a">Zero-Build &amp; PWA</text>
    </g>

    <!-- Pill 5: Deep Link /1 - /7563 -->
    <g transform="translate(202, 46)">
      <rect x="0" y="0" width="200" height="34" rx="8" fill="#042f24" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.2" />
      <text x="14" y="22" font-size="14">🔗</text>
      <text x="38" y="22" class="sb-badge" font-size="13" fill="#fde68a">Deep Link /1 – /7563</text>
    </g>

    <!-- Pill 6: Naskhah Sultaniyyah -->
    <g transform="translate(414, 46)">
      <rect x="0" y="0" width="195" height="34" rx="8" fill="#042f24" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.2" />
      <text x="14" y="22" font-size="14">📚</text>
      <text x="38" y="22" class="sb-badge" font-size="13" fill="#fde68a">Sultaniyyah Bulaq 1311 H</text>
    </g>
  </g>

  <!-- Bottom URL / Domain Anchor -->
  <g transform="translate(80, 545)">
    <circle cx="8" cy="8" r="5" fill="#10b981" />
    <text x="24" y="13" class="sb-badge" font-size="15" fill="#6ee7b7" letter-spacing="1">
      maktabah-maftoohah.github.io/sahih-al-bukhari
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- 6. RIGHT MEDALLION AREA (Giant 3D Glowing Bukhari Emblem)                  -->
  <!-- ========================================================================= -->
  <g transform="translate(850, 120)">
    <!-- Glowing Outer Aura -->
    <circle cx="190" cy="190" r="210" fill="url(#sbGlowRight)" />

    <!-- Scaled Emblem -->
    <svg width="380" height="380" viewBox="0 0 512 512">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#032c21" />
      <stop offset="100%" stop-color="#011a14" />
    </linearGradient>

    <!-- Regal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="25%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Emerald Glow Radial -->
    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="48%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&amp;family=Inter:wght@600;700;800&amp;display=swap');
      .ar-title { font-family: 'Amiri', 'Traditional Arabic', serif; font-weight: 700; }
      .latin-brand { font-family: 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.85" />
  <rect width="480" height="480" x="16" y="16" rx="92" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />

  <!-- Ambient Emerald Aura -->
  <circle cx="256" cy="240" r="190" fill="url(#emeraldAura)" />

  <!-- Outer Islamic 8-Point Geometric Star (Rub el Hizb) Background -->
  <g transform="translate(256, 240)" opacity="0.22" stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <rect x="-140" y="-140" width="280" height="280" rx="20" />
    <rect x="-140" y="-140" width="280" height="280" rx="20" transform="rotate(45)" />
    <circle r="152" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <!-- Central Open Hadith Tome / Manuscript -->
  <g id="HadithBook" transform="translate(256, 225)">
    <!-- Book Drop Shadow -->
    <ellipse cx="0" cy="98" rx="130" ry="16" fill="#000000" opacity="0.45" />

    <!-- Open Book Cover (Leather Moroccan Emerald) -->
    <path d="M-132,78 Q-66,94 0,82 Q66,94 132,78 L138,-52 Q66,-36 0,-48 Q-66,-36 -138,-52 Z" 
          fill="#065f46" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Book Inner Pages (Cream & White Parchment) -->
    <path d="M-124,70 Q-62,84 0,74 Q62,84 124,70 L130,-44 Q62,-30 0,-40 Q-62,-30 -130,-44 Z" 
          fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="1" />

    <!-- Book Spine Center Fold & Shading -->
    <path d="M-6,-40 Q0,-42 6,-40 L6,74 Q0,76 -6,74 Z" fill="#94a3b8" opacity="0.6" />
    <line x1="0" y1="-41" x2="0" y2="75" stroke="#047857" stroke-width="2" />

    <!-- Manuscript Text Ruling Lines (Gold Ink) -->
    <!-- Left Page Lines -->
    <line x1="-105" y1="-18" x2="-22" y2="-12" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="-110" y1="2" x2="-22" y2="8" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="-105" y1="22" x2="-22" y2="28" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="-95" y1="42" x2="-35" y2="48" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Right Page Lines -->
    <line x1="22" y1="-12" x2="105" y2="-18" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="22" y1="8" x2="110" y2="2" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="22" y1="28" x2="105" y2="22" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="35" y1="48" x2="95" y2="42" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Silk Bookmark Ribbon (Draping Down) -->
    <path d="M-5,-42 Q-3,10 8,88 L22,96 L16,84 Q4,10 5,-42 Z" fill="#d97706" stroke="#b45309" stroke-width="1" />
    <polygon points="8,88 22,96 17,90 22,84" fill="#fbbf24" />
  </g>

  <!-- Arabic Calligraphy Inscription: "صحيح البخاري" -->
  <text x="256" y="375" text-anchor="middle" class="ar-title" font-size="44" fill="url(#goldGrad)" letter-spacing="1">صَحِيحُ الْبُخَارِيِّ</text>

  <!-- Subtitle Ribbon Badge: "MAKTABAH MAFTOOHAH" -->
  <g transform="translate(256, 432)">
    <rect x="-145" y="-18" width="290" height="34" rx="10" fill="#042f24" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle cx="-120" cy="-1" r="3" fill="#fbbf24" />
    <circle cx="120" cy="-1" r="3" fill="#fbbf24" />
    <text x="0" y="5" text-anchor="middle" class="latin-brand" font-size="14.5" font-weight="700" fill="#34d399" letter-spacing="2.5">MAKTABAH MAFTOOHAH</text>
  </g>
</svg>
    </svg>
  </g>
</svg>